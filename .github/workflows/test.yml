name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  security:
    name: ${{ github.event_name == 'pull_request' && 'Push Guard PR gate' || 'Push Guard main-policy scan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Dragon-Lady/push-guard
          ref: 87b1c8c210a6d6d8d584f49304157b5f1a321ac0
          path: .ci-push-guard
          persist-credentials: false
      - name: Scan range and complete tracked source snapshot
        env:
          PYTHONPATH: ${{ github.workspace }}/.ci-push-guard/src
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          base=$(git rev-parse --verify "${BASE_REF}^{commit}")
          python3 -P -m push_guard scan --base "$base" --head HEAD --no-infer
          policy=$(mktemp -d)
          trap 'rm -rf "$policy"' EXIT
          if git cat-file -e "$base:.push-guard-allow" 2>/dev/null; then
            git show "$base:.push-guard-allow" > "$policy/.push-guard-allow"
          fi
          git archive --format=tar.gz --prefix=source/ HEAD > "$RUNNER_TEMP/source.tar.gz"
          python3 -P -m push_guard scan-package --repo "$policy" --no-infer "$RUNNER_TEMP/source.tar.gz"
